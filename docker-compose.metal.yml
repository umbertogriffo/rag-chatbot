# Docker Compose override for CPU-only deployment
# To use this file: docker-compose -f docker-compose.yml -f docker-compose.metal.yml up

services:
  llama-server:
    # Use CPU-only image
    image: ghcr.io/ggml-org/llama.cpp:server-b9501
    environment: {}
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations: {}
