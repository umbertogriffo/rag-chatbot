# Docker Compose override for CPU-only deployment
# To use this file: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

services:
  llama-server:
    # Use CPU-only image
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --models-dir /models
      --host 0.0.0.0
      --port 8080
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.00
      --kv-unified
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn on --fit on
      --ctx-size 4096
      --verbose
      --chat-template-kwargs "{\"enable_thinking\": false}"
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
