name: CI

on:
  push:
    branches:
      - "main"
    paths:
      - "chatbot/**"
      - "backend/**"
      - "tests/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "!.gitignore"
      - "!README.md"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "chatbot/**"
      - "backend/**"
      - "tests/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "!.gitignore"
      - "!README.md"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Get poetry version
        id: poetry-version
        run: echo "poetry-version=$(cat version/poetry)" >> "$GITHUB_OUTPUT"

      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ steps.poetry-version.outputs.poetry-version }}
          virtualenvs-in-project: true

      - name: Setup environment
        run: |
          poetry check --lock
          poetry install --no-root --no-ansi

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.0.2

      - name: Run llama.cpp server without NVIDIA CUDA acceleration
        run: |
          docker-compose -f docker-compose.yml -f docker-compose.metal.yml up

      - name: Run tests
        run: |
          poetry run python -m pytest --durations=5 --log-cli-level=DEBUG --capture=tee-sys -v --cov=chatbot --cov-report=term-missing --cov-fail-under=68
